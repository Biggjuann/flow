[project]
name = "adengine"
version = "0.1.0"
description = "Autonomous Meta campaign builder: URL -> Brand DNA -> ad concepts -> scored launch package"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
adengine = "adengine.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
